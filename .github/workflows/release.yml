name: Release

# Push a tag like v0.3.0, or run this workflow by hand with a version, to
# build, sign (when a certificate is configured) and publish a GitHub release
# with the app and its setup.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.3.0 (empty: build only)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 nsis osslsigncode
          rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      # Signs with the certificate in the repository secrets when present.
      # Otherwise a self-signed "Glint" certificate is made for this run, so
      # every release is signed; only a trusted certificate clears SmartScreen.
      - name: Prepare signing certificate
        env:
          CERT: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          PFX="$RUNNER_TEMP/cert.pfx"
          if [ -n "$CERT" ]; then
            echo "$CERT" | base64 -d > "$PFX"
            PASS="$CERT_PASSWORD"
          else
            echo "::warning::SIGNING_CERT_PFX_BASE64 is not set; signing with a self-signed certificate."
            PASS=$(openssl rand -hex 16)
            openssl req -x509 -newkey rsa:3072 -sha256 -days 1095 -nodes \
              -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" \
              -subj "/CN=Glint/O=Glint" \
              -addext "extendedKeyUsage=codeSigning" -addext "keyUsage=digitalSignature"
            openssl pkcs12 -export -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cert.pem" \
              -out "$PFX" -passout "pass:$PASS" -name Glint
            rm -f "$RUNNER_TEMP/key.pem"
          fi
          echo "::add-mask::$PASS"
          echo "SIGN_PFX=$PFX" >> "$GITHUB_ENV"
          echo "SIGN_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build
        run: bash installer/build.sh

      - name: Remove certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/cert.pfx" "$RUNNER_TEMP/cert.pem"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Glint ${{ inputs.tag || github.ref_name }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: |
            installer/out/GlintSetup.exe
            installer/out/Glint.exe
            installer/out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/') && inputs.tag == ''"
        with:
          name: glint-windows-x64
          path: installer/out/*
