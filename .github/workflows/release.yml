name: Release

# Push a tag like v0.3.0 to build, sign (when a certificate is configured)
# and publish a GitHub release with the app and its setup.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 nsis osslsigncode
          rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Load signing certificate
        env:
          CERT: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "$CERT" | base64 -d > "$RUNNER_TEMP/cert.pfx"
            echo "SIGN_PFX=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_CERT_PFX_BASE64 is not set, so this release is unsigned."
          fi

      - name: Build
        env:
          SIGN_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: bash installer/build.sh

      - name: Remove certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/cert.pfx"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/out/GlintSetup.exe
            installer/out/Glint.exe
            installer/out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: glint-windows-x64
          path: installer/out/*
