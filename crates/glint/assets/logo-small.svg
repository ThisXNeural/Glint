<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Search</title>
  <defs>
    <!-- Windows 11 bloom: deep blue through violet to magenta -->
    <linearGradient id="tile" x1="24" y1="16" x2="232" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.55" stop-color="#7B3FF2"/>
      <stop offset="1" stop-color="#D23CC8"/>
    </linearGradient>
    <radialGradient id="sheen" cx="70" cy="40" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="70" y1="60" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1B0B4D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded tile, Windows 11 app icon proportions -->
  <rect x="0" y="0" width="256" height="256" rx="60" fill="url(#tile)"/>
  <rect x="0" y="0" width="256" height="256" rx="60" fill="url(#sheen)"/>
  <rect x="0.5" y="0.5" width="255" height="255" rx="59.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25"/>

  <g transform="translate(128 128) scale(1.15) translate(-138 -138)">
    <!-- Handle -->
    <path d="M150 150 L192 192" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
    <!-- Lens ring and glass -->
    <circle cx="112" cy="112" r="50" fill="url(#glass)"/>
    <circle cx="112" cy="112" r="50" fill="none" stroke="#FFFFFF" stroke-width="26"/>
    <!-- Glint on the glass -->
    <path d="M88 100 A 28 28 0 0 1 104 84" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-opacity="0.9"/>
  </g>
</svg>
